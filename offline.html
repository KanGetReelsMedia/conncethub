<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Connect Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="https://foundbymk.shop/wp-content/uploads/2026/08/Screenshot-2026-08-01-2.51.00-PM.png">
    <style>body { background: #0B0F19; font-family: Inter, system-ui, sans-serif; }</style>
</head>
<body class="flex items-center justify-center h-screen text-center p-6">
    <div class="bg-white p-8 rounded- border border-[#E5E7EB] w-full max-w-sm shadow-2xl">
        <!-- Logo -->
        <div class="w-16 h-16 bg-[#0B0F19] rounded-2xl flex items-center justify-center mx-auto mb-5 border-2 border-[#E5E7EB]">
            <span class="text-[#2563EB] font-black text-2xl">C</span>
            <span class="text-white font-black text-2xl -ml-1">H</span>
        </div>
        <h1 class="text-2xl font-black text-[#0B0F19] mb-2 tracking-tight">You're Offline</h1>
        <p class="text-[#6B7280] text-sm mb-6 leading-relaxed">No connection. Your hub is saved — check your connection to browse profiles and share your link.</p>

        <button onclick="window.location.reload()" class="bg-[#0B0F19] text-white font-bold py-3.5 px-8 rounded-full w-full hover:bg-black transition border border-[#0B0F19]">Try Again</button>

        <div class="mt-6 flex items-center justify-center gap-2 text- text-[#9CA3AF] uppercase tracking-widest font-bold">
            <span class="w-2 h-2 bg-[#2563EB] rounded-full animate-pulse"></span>
            Connect Hub • Offline Mode
        </div>
    </div>
</body>
</html>
